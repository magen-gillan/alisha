name: Validate and redirect GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install
      - name: Generate Prisma client
        run: bunx prisma generate
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build

  redirect-pages:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://magen-gillan.github.io/alisha/
    steps:
      - name: Create redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="ar" dir="rtl">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0;url=https://alisha-puce.vercel.app/">
              <link rel="canonical" href="https://alisha-puce.vercel.app/">
              <title>اليشيا — جاري فتح النسخة الجديدة</title>
            </head>
            <body>
              <p>جاري فتح النسخة الجديدة من اليشيا… <a href="https://alisha-puce.vercel.app/">اضغط هنا للمتابعة</a></p>
            </body>
          </html>
          HTML
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages artifact
        uses: actions/deploy-pages@v4
